<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player TV Study - 42 Canais</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-sidebar: #181818;
            --bg-hover: #2a2a2a;
            --accent: #e50914;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #search-input {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Scrollbar customizada */
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-track { background: var(--bg-sidebar); }
        .channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .category-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin: 15px 10px 8px 10px;
            letter-spacing: 0.5px;
        }

        .channel-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background-color: var(--bg-hover);
            padding-left: 16px;
        }

        .channel-btn.active {
            background-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        .channel-icon {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* --- PLAYER AREA --- */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            position: relative;
        }

        .player-top-bar {
            padding: 15px 25px;
            background: rgba(24, 24, 24, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #current-channel-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.75rem;
            background: #222;
            padding: 4px 10px;
            border-radius: 12px;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Oculto até o primeiro clique */
        }

        .placeholder-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
        }

        .placeholder-screen svg {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            stroke: #444;
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                height: 45%; 
                order: 2; 
            }
            .player-section { 
                height: 55%; 
                order: 1; 
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- BARRA LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📺 TV Study Player</h2>
                <input type="text" id="search-input" placeholder="🔍 Buscar canal...">
            </div>
            <div class="channel-list" id="channel-list-container">
                <!-- Canais serão injetados aqui via JS -->
            </div>
        </aside>

        <!-- ÁREA DO PLAYER -->
        <main class="player-section">
            <div class="player-top-bar">
                <span id="current-channel-title">Selecione um canal</span>
                <span class="status-badge">Projeto de Estudo Local</span>
            </div>
            
            <div class="iframe-container">
                <div class="placeholder-screen" id="placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <p>Clique em um canal na lista para iniciar a reprodução.</p>
                </div>

                <!-- IFRAME ÚNICO REUTILIZÁVEL -->
                <iframe 
                    id="main-iframe" 
                    src="" 
                    allow="encrypted-media; fullscreen; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </main>
    </div>

    <script>
        // --- BASE DE DADOS COMPLETA (41 IDs únicos) ---
        // Nota: O ID 'sportv3' aparecia 2x na sua lista original, foi consolidado aqui.
        const channelData = [
            {
                category: "TV Aberta",
                items: [
                    { id: "globosp", name: "Globo SP" },
                    { id: "record", name: "Record TV" },
                    { id: "sbt", name: "SBT" },
                    { id: "band", name: "Band" },
                    { id: "redetv", name: "RedeTV!" }
                ]
            },
            {
                category: "Esportes",
                items: [
                    { id: "espn", name: "ESPN" },
                    { id: "espn2", name: "ESPN 2" },
                    { id: "espn3", name: "ESPN 3" },
                    { id: "espn4", name: "ESPN 4" },
                    { id: "sportv", name: "SporTV" },
                    { id: "sportv2", name: "SporTV 2" },
                    { id: "sportv3", name: "SporTV 3" },
                    { id: "premiere7", name: "Premiere" },
                    { id: "xsports", name: "XSports" }
                ]
            },
            {
                category: "Filmes e Séries",
                items: [
                    { id: "hbo", name: "HBO" },
                    { id: "hbo2", name: "HBO 2" },
                    { id: "hbofamily", name: "HBO Family" },
                    { id: "hboplus", name: "HBO Plus" },
                    { id: "telecinepremium", name: "Telecine Premium" },
                    { id: "telecineaction", name: "Telecine Action" },
                    { id: "telecinecult", name: "Telecine Cult" },
                    { id: "telecinefun", name: "Telecine Fun" },
                    { id: "telecinepipoca", name: "Telecine Pipoca" },
                    { id: "telecinetouch", name: "Telecine Touch" },
                    { id: "tnt", name: "TNT" },
                    { id: "space", name: "Space" },
                    { id: "cinemax", name: "Cinemax" },
                    { id: "megapix", name: "Megapix" },
                    { id: "axn", name: "AXN" },
                    { id: "universaltv", name: "Universal TV" },
                    { id: "warnerchannel", name: "Warner Channel" }
                ]
            },
            {
                category: "Documentários e Infantil",
                items: [
                    { id: "discoverychannel", name: "Discovery Channel" },
                    { id: "discoveryhh", name: "Discovery Home & Health" },
                    { id: "discoveryscience", name: "Discovery Science" },
                    { id: "history", name: "History Channel" },
                    { id: "history2", name: "History 2" },
                    { id: "animalplanet", name: "Animal Planet" },
                    { id: "off", name: "Off" },
                    { id: "cartoonnetwork", name: "Cartoon Network" },
                    { id: "cartoonito", name: "Cartoonito" },
                    { id: "discoverykids", name: "Discovery Kids" }
                ]
            }
        ];

        // --- REFERÊNCIAS DO DOM ---
        const listContainer = document.getElementById('channel-list-container');
        const mainIframe = document.getElementById('main-iframe');
        const placeholder = document.getElementById('placeholder');
        const channelTitle = document.getElementById('current-channel-title');
        const searchInput = document.getElementById('search-input');

        const BASE_URL = "https://sinalpublicoetv.vercel.app/?id=";

        // --- FUNÇÃO DE RENDERIZAÇÃO ---
        function renderChannels(filterText = "") {
            listContainer.innerHTML = ""; // Limpa a lista atual
            const lowerFilter = filterText.toLowerCase();

            channelData.forEach(category => {
                // Filtra os itens da categoria com base na busca
                const filteredItems = category.items.filter(ch => 
                    ch.name.toLowerCase().includes(lowerFilter) || 
                    ch.id.toLowerCase().includes(lowerFilter)
                );

                // Se houver itens correspondentes, renderiza a categoria
                if (filteredItems.length > 0) {
                    const catLabel = document.createElement('div');
                    catLabel.className = 'category-label';
                    catLabel.textContent = category.category;
                    listContainer.appendChild(catLabel);

                    filteredItems.forEach(channel => {
                        const btn = document.createElement('button');
                        btn.className = 'channel-btn';
                        btn.innerHTML = `<span class="channel-icon">▶</span> ${channel.name}`;
                        
                        btn.addEventListener('click', () => {
                            playChannel(channel.id, channel.name, btn);
                        });

                        listContainer.appendChild(btn);
                    });
                }
            });
        }

        // --- FUNÇÃO DE REPRODUÇÃO ---
        function playChannel(channelId, channelName, activeBtn) {
            // 1. Atualiza o título
            channelTitle.textContent = channelName;

            // 2. Gerencia a visualização (esconde placeholder, mostra iframe)
            placeholder.style.display = 'none';
            mainIframe.style.display = 'block';

            // 3. Troca a fonte do iframe (O segredo para não abrir abas)
            // O parâmetro &t= força o navegador a não usar o cache, garantindo stream fresco
            mainIframe.src = `${BASE_URL}${channelId}&t=${Date.now()}`;

            // 4. Atualiza o estado visual (botão ativo)
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        // --- EVENT LISTENER DE BUSCA ---
        searchInput.addEventListener('input', (e) => {
            renderChannels(e.target.value);
        });

        // --- INICIALIZAÇÃO ---
        renderChannels();
    </script>
</body>
</html>
